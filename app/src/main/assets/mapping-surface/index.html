<title>R2C 3D surface</title><style>html,body{margin:0;height:100%;background:#172730;color:#fff;font:16px system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}header{position:absolute;top:12px;left:12px;right:12px;padding:12px;background:#172730dc;border-radius:8px;pointer-events:none}h1{margin:0;font-size:20px}p{margin:6px 0 0;font-size:14px}footer{position:absolute;bottom:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}button{padding:12px 18px;border:1px solid #a9c1ce;border-radius:8px;background:#fff;color:#173b4c;font-size:16px}#status{padding:8px;background:#172730dc}#scale{padding:8px 12px;background:#172730ed;border-radius:6px;font-size:13px}#scale-bar{height:8px;border:solid white;border-width:0 2px 3px;box-sizing:border-box;margin:5px 0}#scale-value{font-variant-numeric:tabular-nums}</style></head>
